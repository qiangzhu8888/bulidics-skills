opy{padding:20px}.exhibit-copy p{font-size:15px}.visit-top{padding:22px}.booth-number{font-size:38px}.visit-top .booth-label{margin-top:12px}.visit-actions{padding:20px}.match-card{margin-top:0}.related{padding:30px 20px}.related-grid{grid-template-columns:1fr}.related-card{padding:19px}.related-card h3{margin:8px 0 13px}.related-top h2{font-size:17px}.mobile-action{position:fixed;bottom:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:10px 20px calc(10px + env(safe-area-inset-bottom));background:#fffffff5;border-top:1px solid #e5dfd4;z-index:10;backdrop-filter:blur(10px);gap:12px}.mobile-action span{font-size:10px;white-space:nowrap}.mobile-action b{font-size:18px;display:block;color:var(--red);margin-top:2px}.mobile-action a{padding:11px 25px;background:var(--red);color:white;border-radius:3px;font-size:11px;text-decoration:none}.footer{padding-bottom:90px}.crumb{font-size:10px;padding:22px 0}.related-top a{font-size:10px}.company-table th{width:72px}.hero-logo{width:65px}.hero-tags span{font-size:9px}.note{margin-top:0}}
</style></head><body><header><a class="brand" href="./"><b>AiMeet</b><span>サンプル展示会<br>出展者ガイド</span></a><div class="header-right"><span class="powered">Powered by <b>AiMeet</b></span><a class="backlink" href="./">出展者一覧へ ↗</a></div></header><main class="wrap" id="page"><p class="empty-detail">出展者情報を読み込んでいます…</p></main><section class="wrap" id="integration" style="padding-top:24px;padding-bottom:24px"><p class="note">デザイン見本：掲載情報はすべて架空です。メッセージ・マッチングは実装先の既存機能に接続してください。</p></section><div id="related"></div><footer class="footer"><div><b>AiMeet</b> <span>出会いを、ビジネスの力に。</span></div><div>サンプル展示会（架空） 出展者ガイド<a href="https://aimeet.jp" target="_blank" rel="noopener">AiMeetについて ↗</a></div></footer><div id="mobile"></div>
<script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const safe=s=>{if(typeof s!=='string'||!s.trim())return '';try{const u=new URL(s,location.href);return /^https?:$/.test(u.protocol)?u.href:''}catch{return ''}};let saved=new Set();try{saved=new Set(JSON.parse(localStorage.getItem('aimeet-ui-reference-favorites')||'[]'))}catch{};let selected;
function setFavorite(){const on=saved.has(selected.id);document.querySelectorAll('[data-favorite]').forEach(b=>{b.textContent=on?'♥ お気に入り登録済み':'♡ お気に入りに追加';b.classList.toggle('favorited',on);b.setAttribute('aria-pressed',String(on))})}
fetch('./exhibitors.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{const slug=new URLSearchParams(location.search).get('slug')||'demo-01';const i=data.find(i=>i.slug===slug||i.id===slug);if(!i){$('page').innerHTML='<div class="empty-detail">出展者が見つかりませんでした。<br><a href="./">出展者一覧に戻る</a></div>';return}selected=i;document.title=i.companyName+' | サンプル展示会（架空） 出展者ガイド';const portal='#integration',message='#integration';const cs=i.categories?.length?i.categories:(i.category?[i.category]:[]);const web=safe(i.websiteUrl),logo=safe(i.logoUrl);let sectionNumber=0;const section=(id,title,en,body)=>`<section class="editorial-section" id="${id}"><div class="section-title"><span>${String(++sectionNumber).padStart(2,'0')}</span><h2>${title}</h2><small>${en}</small></div>${body}</section>`;const row=(a,b)=>b?`<tr><th scope="row">${a}</th><td>${b}</td></tr>`:'';const intro=i.exhibitionContent||i.visitorAppeal||'';const table=row('会社名',esc(i.companyName))+row('所在地',esc((i.postalCode?'〒'+i.postalCode+'\n':'')+[i.prefecture,i.city,i.addressLine].filter(Boolean).join('')))+row('電話番号',i.contactPhone?`<a href="tel:${esc(i.contactPhone.replace(/[^+\d-]/g,''))}">${esc(i.contactPhone)}</a>`:'')+row('Webサイト',web?`<a class="quiet-link" href="${esc(web)}" target="_blank" rel="noopener">${esc(new URL(web).hostname)} ↗</a>`:'')+row('共同出展',esc(i.parentCompanyName));
$('page').innerHTML=`<nav class="crumb" aria-label="パンくず"><a href="./">出展者一覧</a><span>/</span><span>${esc(i.companyName)}</span></nav><div class="detail-layout"><div class="detail-main"><section class="company-hero"><div class="intro-top"><div><div class="eyebrow">EXHIBITOR / AIMEET DESIGN REFERENCE</div><h1>${esc(i.companyName)}</h1><div class="kana">${esc(i.companyNameKana)}</div></div>${logo?`<img class="hero-logo" src="${esc(logo)}" alt="${esc(i.companyName)}のロゴ">`:''}</div><div class="hero-tags">${cs.map(c=>`<span>${esc(c)}</span>`).join('')}</div><div class="mini-info"><span>サンプル展示会（架空）</span><span>サンプル会場（架空）</span></div></section><nav class="section-nav" aria-label="ページ内ナビゲーション">${i.exhibitionContent?'<a href="#exhibition">展示内容</a>':''}${i.companyDescription?'<a href="#about">企業紹介</a>':''}${i.visitorAppeal?'<a href="#message">来場者へのメッセージ</a>':''}<a href="#company">会社情報</a><a href="#visit">お問い合わせ</a></nav>${i.exhibitionContent?section('exhibition','展示内容','EXHIBITION',`<div class="exhibit-copy"><p>${esc(i.exhibitionContent)}</p></div>`):''}${i.companyDescription?section('about','企業紹介','ABOUT US',`<p>${esc(i.companyDescription)}</p>`):''}${i.visitorAppeal?section('message','来場者へのメッセージ','MESSAGE',`<p>${esc(i.visitorAppeal)}</p>`):''}${section('company','会社情報','COMPANY',`<table class="company-table"><tbody>${table}</tbody></table>`)}<a class="backlink" href="./">← 出展者一覧に戻る</a></div><aside class="sidebar-detail"><div class="visit-card" id="visit"><div class="visit-top"><small>BOOTH INFORMATION</small><div class="booth-label">小間番号</div><div class="booth-number">${esc(i.boothNumber||'未登録')}</div><p>サンプル展示会（架空）<br>サンプル会場（架空）</p></div><div class="visit-actions"><a class="action primary" href="${esc(message)}">出展社へメッセージ ↗</a><button class="action" data-favorite></button>${web?`<a class="action" href="${esc(web)}" target="_blank" rel="noopener">公式サイトを見る ↗</a>`:''}<small>デモ用の操作です。実装時は既存の認証・送信確認に接続してください。</small></div></div><div class="match-card"><div class="eyebrow">PERSONAL DISCOVERY</div><h3>この出展者との相性は？</h3><p>AiMeetにログインして、マッチング結果を確認できます。</p><a href="#integration">マッチング結果を確認する ↗</a></div><p class="note">架空の見本データ<br>お気に入りはこのブラウザに保存されます。</p></aside></div>`;
const others=data.filter(j=>j.id!==i.id&&(j.categories||[j.category]).some(c=>cs.includes(c))).slice(0,3);$('related').innerHTML=others.length?`<section class="related"><div class="related-inner"><div class="related-top"><h2>同じカテゴリの出展者</h2><a href="./">すべての出展者を見る ↗</a></div><div class="related-grid">${others.map(j=>`<a class="related-card" href="./exhibitor.html?slug=${encodeURIComponent(j.slug||j.id)}"><small>${esc((j.categories||[j.category]).filter(c=>cs.includes(c)).join(' / '))}</small><h3>${esc(j.companyName)}</h3><span>小間番号 ${esc(j.boothNumber)}　↗</span></a>`).join('')}</div></div></section>`:'';$('mobile').innerHTML=`<div class="mobile-action"><span>小間番号<b>${esc(i.boothNumber||'未登録')}</b></span><a href="${esc(message)}">出展社へメッセージ ↗</a></div>`;setFavorite();document.querySelector('[data-favorite]').onclick=()=>{saved.has(i.id)?saved.delete(i.id):saved.add(i.id);try{localStorage.setItem('aimeet-ui-reference-favorites',JSON.stringify([...saved]))}catch{}setFavorite()};document.querySelectorAll('.hero-logo').forEach(img=>img.onerror=()=>img.remove());}).catch(()=>{$('page').innerHTML='<div class="empty-detail">情報を読み込めませんでした。<br><a href="./">出展者一覧に戻る</a></div>'});
</script></body></html>
